# Desenvolvimento local: credenciais do compose de dev e SQL no console

# Lê o .env do diretório de trabalho, se existir; variáveis de ambiente reais continuam valendo mais.
# Só em dev: em produção os segredos vêm do ambiente do host
spring.config.import=optional:file:.env[.properties]

DB_USERNAME=kcrm
DB_PASSWORD=kcrm

# Mailpit do docker compose: captura os e-mails, sem autenticação nem TLS (http://localhost:8025)
SMTP_HOST=localhost
SMTP_PORT=1025
SMTP_USERNAME=
SMTP_PASSWORD=
SMTP_AUTH=false
SMTP_STARTTLS=false
EMAIL_REMETENTE=kcrm <nao-responda@kcrm.local>
CONFIRMACAO_URL_BASE=http://localhost:5173/confirmar-email

spring.jpa.show-sql=true
