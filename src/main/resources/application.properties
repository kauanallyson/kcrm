spring.application.name=kcrm

# Sem profile ativo, roda como dev. Em produção, SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kcrm}
# Segredos sem default: só o profile dev fornece valores locais; em prod, faltar um derruba o startup
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool do Hikari: pequeno de propósito (cada conexão custa memória no Postgres).
# Timeouts em milissegundos; max-lifetime abaixo de qualquer corte de conexão ociosa do lado do banco
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# Schema versionado pelo Flyway (db/migration); o Hibernate só confere se os mapeamentos batem
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Parâmetros de SQL carregam dados pessoais (CPF); nunca vão para o log
logging.level.org.hibernate.orm.jdbc.bind=off
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT: JWT_SECRET is required (base64, >= 256 bits); the app refuses to start without it
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:1h}

# Administrador único, criado no startup se ainda não existir; sem as duas variáveis, nenhum é criado
kcrm.administrador.email=${ADMINISTRADOR_EMAIL:}
kcrm.administrador.senha=${ADMINISTRADOR_SENHA:}

# E-mail por SMTP genérico: Mailpit em dev; em prod, Resend (smtp.resend.com, usuário "resend", API key como senha)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
kcrm.email.remetente=${EMAIL_REMETENTE}
# SMTP fora do ar não deve tirar a aplicação do balanceamento
management.health.mail.enabled=false

# Confirmação de E-mail: o link é <CONFIRMACAO_URL_BASE>?token=..., uma tela que envia o token
# para POST /api/auth/confirmacao. Contas não confirmadas são apagadas após 7 dias (verificado de hora em hora)
kcrm.confirmacao.url-base=${CONFIRMACAO_URL_BASE}

# Atrás do Traefik: usa o X-Forwarded-For como IP do cliente. "native" só confia no header
# quando a conexão vem de rede privada (o proxy), então um cliente direto não consegue forjá-lo
server.forward-headers-strategy=native

# Ao receber SIGTERM, para de aceitar requisições e espera as em andamento terminarem
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# Actuator: health e métricas no formato do Prometheus, numa porta própria que o Traefik não roteia
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Rate limit por IP, contado no Redis para valer entre todas as instâncias.
# "auth" protege login/cadastro contra força bruta; "api" vale para o resto
kcrm.rate-limit.auth.requests=${RATE_LIMIT_AUTH:10}
kcrm.rate-limit.auth.period=1m
kcrm.rate-limit.api.requests=${RATE_LIMIT_API:100}
kcrm.rate-limit.api.period=1s

# CORS: origens exatas separadas por vírgula, sem curinga. Sem valor, nenhuma origem é liberada
kcrm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger UI em /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Paginação das listagens: size acima de 100 é limitado a 100
spring.data.web.pageable.max-page-size=100

# Id da requisição (RequestIdFilter) em toda linha de log em texto; no JSON ele vai como campo do MDC
logging.pattern.correlation=[%X{requestId:-}] 
