spring.application.name=kcrm

# Load .env from the working directory if present; real environment variables still take precedence
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kcrm}
spring.datasource.username=${DB_USERNAME:kcrm}
spring.datasource.password=${DB_PASSWORD:kcrm}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT: JWT_SECRET is required (base64, >= 256 bits); the app refuses to start without it
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:1h}

# Initial Admin: created at startup only if no active Admin exists; ignored otherwise.
# If none exists and any of these is missing, the app logs a warning and starts anyway.
admin.nome=${ADMIN_NOME:}
admin.email=${ADMIN_EMAIL:}
admin.senha=${ADMIN_SENHA:}
admin.cpf=${ADMIN_CPF:}
admin.telefone=${ADMIN_TELEFONE:}
admin.endereco.rua=${ADMIN_ENDERECO_RUA:}
admin.endereco.numero=${ADMIN_ENDERECO_NUMERO:}
admin.endereco.bairro=${ADMIN_ENDERECO_BAIRRO:}
admin.endereco.cidade=${ADMIN_ENDERECO_CIDADE:}
admin.endereco.estado=${ADMIN_ENDERECO_ESTADO:}
admin.endereco.cep=${ADMIN_ENDERECO_CEP:}
# Optional
admin.endereco.complemento=${ADMIN_ENDERECO_COMPLEMENTO:}
