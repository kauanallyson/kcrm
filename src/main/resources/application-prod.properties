# Produção: nenhum segredo tem default (DB_USERNAME, DB_PASSWORD, JWT_SECRET vêm do ambiente)
# SQL não vai para o log, pois carrega dados pessoais (CPF, telefone)
spring.jpa.show-sql=false

# Logs em JSON (ECS) para a coleta centralizada; em dev fica o texto legível padrão
logging.structured.format.console=ecs
