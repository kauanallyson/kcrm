global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kcrm
    metrics_path: /actuator/prometheus
    static_configs:
      # Porta de management do serviço kcrm, só acessível na rede do compose
      - targets: ["kcrm:8081"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
