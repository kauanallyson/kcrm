name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testes de integração sobem Postgres e Redis via Testcontainers (o runner já tem Docker)
      - name: ./mvnw verify
        run: ./mvnw -B verify

  dependencias:
    name: Vulnerabilidades nas dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O jar carrega as dependências efetivas (transitivas e as do BOM do Spring Boot); o pom.xml sozinho não
      - name: Empacota o jar
        run: ./mvnw -B -q package -DskipTests

      # Falha só em CRITICAL com correção disponível; o resto aparece no relatório
      - name: Trivy no jar
        run: >
          docker run --rm -v "$PWD/target":/target:ro aquasec/trivy:0.65.0
          rootfs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 /target

  imagem:
    name: Imagem no Docker Hub
    # Só na main e depois dos testes e do scan de dependências; PR nunca publica
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependencias]
    runs-on: ubuntu-latest
    env:
      IMAGEM: kauanallyson/kcrm
    steps:
      - uses: actions/checkout@v5

      # arm64 para a VPS da Oracle, emulado via QEMU no runner amd64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build amd64 carregado no runner só para o Trivy escanear antes de qualquer push
      - name: Build para o scan
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kcrm:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy na imagem
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0
          image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 kcrm:scan

      - name: Build e push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
