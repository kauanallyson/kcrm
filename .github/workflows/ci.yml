name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testes de integração sobem Postgres e Redis via Testcontainers (o runner já tem Docker)
      - name: ./mvnw verify
        run: ./mvnw -B verify

  dependencias:
    name: Vulnerabilidades nas dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Falha só em CRITICAL com correção disponível; o resto aparece no relatório
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
