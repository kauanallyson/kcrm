services:
  postgres:
    image: postgres:17-alpine
    container_name: kcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kcrm}
      POSTGRES_USER: ${DB_USERNAME:-kcrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kcrm}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kcrm:
    build: .
    image: kcrm:local
    container_name: kcrm-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kcrm}
      DB_USERNAME: ${DB_USERNAME:-kcrm}
      DB_PASSWORD: ${DB_PASSWORD:-kcrm}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -base64 32)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-100}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MANAGEMENT_PORT: 8081
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
    # Maior que o SHUTDOWN_TIMEOUT, para o Docker não matar a app no meio do graceful shutdown
    stop_grace_period: 30s
    # Sem portas no host: o tráfego público entra pelo Traefik e o management fica só na rede interna
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  traefik:
    image: traefik:v3.5
    container_name: kcrm-traefik
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --ping=true
    ports:
      - "80:80"
      # Dashboard do Traefik
      - "8088:8080"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kcrm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:12.1.0
    container_name: kcrm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  # Logs de todos os containers; sem porta no host, consultado só pelo Grafana
  loki:
    image: grafana/loki:3.5.3
    container_name: kcrm-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # Coletor: lê os containers pelo socket do Docker (somente leitura) e envia ao Loki
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: kcrm-alloy
    restart: unless-stopped
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    # A imagem não tem wget/curl: faz o GET no /-/ready pelo /dev/tcp do bash
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  grafana-data:
  loki-data:
