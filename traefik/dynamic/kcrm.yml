# A aplicação roda no host; para escalar, adicione uma entrada em servers por instância.
# O rate limit fica no Redis, então todas as instâncias dividem o mesmo contador.
http:
  routers:
    kcrm:
      entryPoints: [web]
      rule: PathPrefix(`/api`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)
      service: kcrm

  services:
    kcrm:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8080
        healthCheck:
          # Pela porta de management, que fica fora do roteamento público
          path: /actuator/health/readiness
          port: 8081
          interval: 10s
          timeout: 3s
