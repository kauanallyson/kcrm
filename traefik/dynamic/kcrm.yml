# A aplicação roda no serviço kcrm do compose; para escalar, adicione uma entrada em servers por instância.
# O rate limit é contado em memória, então cada instância tem o próprio contador.
http:
  routers:
    kcrm:
      entryPoints: [web]
      rule: PathPrefix(`/api`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)
      service: kcrm

  services:
    kcrm:
      loadBalancer:
        servers:
          - url: http://kcrm:8080
        healthCheck:
          # Pela porta de management, que fica fora do roteamento público
          path: /actuator/health/readiness
          port: 8081
          interval: 10s
          timeout: 3s
